worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/vtt;
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name example.com;
        ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ShixuTLS:1m;
        ssl_session_tickets off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), focus-without-user-activation=()" always;
        # Replace https://media.example.com with your S3/object-storage media origin if using signed redirects.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' https://media.example.com; connect-src 'self'; frame-src 'self' https://media.example.com; object-src 'none'; base-uri 'none'; frame-ancestors 'self'" always;
        location ^~ /media/ {
            alias /srv/shixu/public-audio/;
            autoindex off;
            gzip off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            add_header Cross-Origin-Resource-Policy cross-origin always;
            add_header X-Content-Type-Options nosniff always;
            limit_except GET { deny all; }
        }
        location / {
            proxy_pass http://127.0.0.1:8418;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
    }
}
